# Analiză statică de securitate (CodeQL, setul security-extended) pentru Python și JavaScript.
# Rulează la push pe main, la pull request-urile din acest repo și săptămânal. Rezultatele apar în fila Security a repo-ului.
# security-events: write e singurul drept în plus și există doar aici, pentru încărcarea rezultatelor.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analiza:
    name: CodeQL (${{ matrix.language }})
    # Un pull request din fork nu primește dreptul security-events: write, deci rezultatele n-ar putea fi încărcate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Descarcă codul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pregătește CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analizează
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
