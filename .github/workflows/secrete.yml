# Garda împotriva scurgerilor: nicio parolă, cheie sau dată personală nu are voie să ajungă în repo.
#  1. gitleaks pe TOT istoricul și pe arborele curent (binar cu versiune fixată și sumă SHA-256 verificată);
#  2. un pas care pică dacă git urmărește fișiere cu date personale: sesiunea de browser, rezultatele, cookie-urile, mediul.
# Se rulează și săptămânal: o regulă nouă de detectare poate găsi ceva în istoricul vechi.
# Fără secrete: workflow-ul nu primește niciunul și are drepturi doar de citire.
name: Secrete

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (istoric + arbore curent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Versiunea și suma de control sunt din release-ul oficial gitleaks/gitleaks (fișierul gitleaks_8.30.1_checksums.txt).
      # La o actualizare se schimbă ambele odată; fără sumă corectă, pasul de instalare pică și nimic nu rulează.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Descarcă codul, cu tot istoricul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalează gitleaks (sumă SHA-256 verificată)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks

      # --redact: valorile găsite nu apar în jurnalul public al rulării.
      - name: Scanează tot istoricul git
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'

      - name: Scanează arborele curent
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" dir --config .gitleaks.toml --redact --no-banner --verbose .'

  fisiere-personale:
    name: fișiere cu date personale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descarcă codul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Aceeași listă ca în tests/test_garda_parole.py (FORBIDDEN_FILE_PATTERNS); aici se verifică pe ce urmărește git efectiv.
      - name: Verifică că git nu urmărește sesiunea, rezultatele, cookie-urile sau cheile
        run: |
          set -euo pipefail
          found="$(git ls-files -z | grep -zEi \
            -e '(^|/)(\.profil_browser|iesiri|logs)(/|$)' \
            -e '(^|/)(comenzi|retururi|analiza|run_info)\.json$' \
            -e '(^|/)(produse|istoric_preturi)\.csv$' \
            -e '(^|/)categorii\.personal\.json$' \
            -e '(^|/)(local state|login data|cookies)$' \
            -e '(^|/)\.env(\.[^/]*)?$' \
            -e '\.(har|pem|key|pfx|p12|kdbx)$' \
            -e '(^|/)id_(rsa|ed25519)(\.[^/]*)?$' \
            | tr '\0' '\n' | grep -viE '(^|/)\.env\.example$' || true)"
          if [ -n "${found}" ]; then
            echo "::error::Git urmărește fișiere care conțin sau pot conține date personale ori secrete. Scoate-le cu «git rm --cached» și adaugă-le în .gitignore."
            echo "${found}"
            exit 1
          fi
          echo "Niciun fișier cu date personale sau secrete nu e urmărit de git."
