# Rulează toate testele (inclusiv gărzile de rețea, parole și scriere) la fiecare push pe main și la fiecare pull request.
# Windows, pentru că programul și lansatoarele .bat sunt pentru Windows; Python 3.13 și 3.14 (cele testate).
# Testele de browser folosesc Edge, preinstalat pe windows-latest; dacă un browser lipsește, testele respective se sar.
# Fără secrete: workflow-ul nu primește niciunul și are drepturi doar de citire.
name: Teste

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Descarcă codul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pornește Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Aceleași opțiuni ca în instaleaza.bat: doar pachete gata făcute, fără memorie locală.
      - name: Instalează dependențele
        run: "python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r requirements-dev.txt"

      # -rs: testele sărite apar cu motiv în jurnal (ex. un browser care lipsește), ca să nu treacă neobservate.
      - name: Rulează testele
        run: python -m pytest -q -rs
