# Dependabot propune, o dată pe săptămână, actualizări pentru pachetele Python fixate și pentru acțiunile GitHub
# fixate pe SHA. Nu comite nimic singur: fiecare actualizare vine ca pull request, trece prin teste și o
# aprobi tu. Actualizările minore și de corecție se grupează într-un singur pull request; cele majore vin separat.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dependente-python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actiuni-github:
        update-types: ["minor", "patch"]
