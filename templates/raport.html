<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Cheltuieli eMAG</title>
<!-- Șablon-schelet: tot designul stă în interfata/assets/dashboard.css și dashboard.js.
     write_report (emag_spend/report_html.py) le lipește mai jos împreună cu datele,
     ca raportul generat să fie UN SINGUR fișier autonom, fără internet. -->
<style>/*__DASHBOARD_CSS__*/</style>
<style>
/* Doar chenarul paginii (antet, buton de temă). Cele câteva culori se repetă aici
   fiindcă tokenii componentei trăiesc pe .emag-dash, nu pe :root. */
:root { color-scheme: light dark; --rp-page: #f9f9f7; --rp-ink: #0b0b0b; --rp-ink-2: #52514e; --rp-border: rgba(11, 11, 11, 0.30); --rp-hover: rgba(11, 11, 11, 0.10); --rp-focus: #1d63b8; }
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --rp-page: #0d0d0d; --rp-ink: #ffffff; --rp-ink-2: #c3c2b7; --rp-border: rgba(255, 255, 255, 0.32); --rp-hover: rgba(255, 255, 255, 0.13); --rp-focus: #6aa7f0; }
}
:root[data-theme="dark"] { color-scheme: dark; --rp-page: #0d0d0d; --rp-ink: #ffffff; --rp-ink-2: #c3c2b7; --rp-border: rgba(255, 255, 255, 0.32); --rp-hover: rgba(255, 255, 255, 0.13); --rp-focus: #6aa7f0; }
html { background: var(--rp-page); }
body { margin: 0; background: var(--rp-page); color: var(--rp-ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.rp-top, .rp-noscript { box-sizing: border-box; }
.rp-top { max-width: 1080px; margin-inline: auto; padding: 28px 16px 0; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.rp-top h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
/* min-height 40 px = --ed-target din dashboard.css: aceeași țintă de apăsare ca butoanele raportului, și cu mouse-ul. */
.rp-theme { border: 1px solid var(--rp-border); background: transparent; color: var(--rp-ink-2); border-radius: 6px; padding: 6px 12px; min-height: 40px; font: inherit; font-size: 12.5px; cursor: pointer; touch-action: manipulation; }
.rp-theme:hover { background: var(--rp-hover); color: var(--rp-ink); }
.rp-theme:focus-visible, .rp-skip:focus-visible { outline: 2px solid var(--rp-focus); outline-offset: 2px; }
.rp-skip { position: absolute; left: 8px; top: -48px; background: var(--rp-page); color: var(--rp-ink); border: 1px solid var(--rp-border); border-radius: 6px; padding: 8px 12px; z-index: 20; }
.rp-skip:focus { top: 8px; }
.rp-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.rp-noscript { max-width: 1080px; margin: 24px auto; padding: 0 16px; color: var(--rp-ink-2); }
@media print { .rp-theme, .rp-skip { display: none; } }
</style>
<script>
/* Tema aleasă se aplică înainte de prima desenare, ca să nu apară o sclipire. */
(function () {
  try {
    var mode = localStorage.getItem('emag-tema');
    if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
  } catch (e) { /* fără stocare: rămâne tema automată */ }
})();
</script>
</head>
<body>
<a class="rp-skip" href="#raport">Sari la raport</a>
<header class="rp-top">
  <h1>Cheltuieli <span translate="no">eMAG</span></h1>
  <button class="rp-theme" id="rp-theme" type="button">Temă: automată</button>
  <p class="rp-sr" id="rp-theme-live" role="status" aria-live="polite"></p>
</header>
<main id="raport">
  <noscript><p class="rp-noscript">Raportul are nevoie de JavaScript ca să se deseneze. Aceleași cifre sunt în <code>rezumat.txt</code> și <code>produse.csv</code>, din același folder.</p></noscript>
</main>

<script id="date-analiza" type="application/json">/*__DATE_ANALIZA__*/null</script>
<script>/*__DASHBOARD_JS__*/</script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('raport');
  var data = null;
  try { data = JSON.parse(document.getElementById('date-analiza').textContent); } catch (e) { data = null; }
  if (window.EmagDashboard) window.EmagDashboard.mount(root, data);

  /* Butonul de temă: automată -> luminoasă -> întunecată, ținută minte în localStorage. */
  var button = document.getElementById('rp-theme');
  var live = document.getElementById('rp-theme-live');
  var modes = ['auto', 'light', 'dark'];
  var names = { auto: 'automată', light: 'luminoasă', dark: 'întunecată' };
  var colors = { light: '#f9f9f7', dark: '#0d0d0d' };
  var metas = Array.prototype.slice.call(document.querySelectorAll('meta[name="theme-color"]'));
  var originals = metas.map(function (m) { return m.getAttribute('content'); });
  var index = 0;
  try { index = Math.max(0, modes.indexOf(localStorage.getItem('emag-tema'))); } catch (e) { index = 0; }

  function apply(announce) {
    var mode = modes[index];
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    // theme-color urmează tema forțată; în modul automat revin valorile din meta, pe scheme.
    metas.forEach(function (m, i) { m.setAttribute('content', mode === 'auto' ? originals[i] : colors[mode]); });
    button.textContent = 'Temă: ' + names[mode];
    button.setAttribute('aria-label', 'Temă: ' + names[mode] + '. Apasă ca să o schimbi.');
    if (announce) live.textContent = 'Tema este acum ' + names[mode] + '.';
    try { localStorage.setItem('emag-tema', mode); } catch (e) { /* fără stocare: tema rămâne doar pe sesiune */ }
  }
  button.addEventListener('click', function () { index = (index + 1) % modes.length; apply(true); });
  apply(false);
})();
</script>
</body>
</html>
